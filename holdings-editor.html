<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>持股更新</title>
<script>
  document.write('<link rel="stylesheet" href="holdings-editor.css?v=' + Date.now() + '">');
</script>
</head>
<body>
  <div class="sheet-wrap">
    <div class="sheet-header">
      <h1>持股更新</h1>
      <div class="auth-row">
        <span class="fx-row">匯率 USD/TWD <input id="fxInput" type="number" step="0.001" disabled /></span>
        <span class="auth-status" id="authStatus">連線中…</span>
        <button class="auth-btn" id="authBtn" type="button">登入編輯</button>
      </div>
    </div>
    <div class="sheet-note">美股的「總投入」「現值」是公式（股數 × 成本均價／現價 × 匯率），跟原本 Sheet 一樣不能直接改；期權沒有這個公式（Sheet 裡本來就是手動填的），維持直接編輯。勾選「已平倉」的部位（賣光了的舊部位）不算總投入/現值，只留已實現損益當歷史紀錄。</div>

    <div class="table-scroll">
      <table class="sheet-table">
        <thead>
          <tr>
            <th>市場</th>
            <th>股票代號</th>
            <th>股票名稱</th>
            <th>股數</th>
            <th>第一筆建倉</th>
            <th>成本均價</th>
            <th>幣別</th>
            <th>現價</th>
            <th>總投入</th>
            <th>現值</th>
            <th>損益</th>
            <th>報酬率</th>
            <th>平倉</th>
            <th>已實現損益</th>
            <th>已平倉</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="sheetBody"></tbody>
        <tfoot id="sheetFoot"></tfoot>
      </table>
    </div>

    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="add-row-btn" id="addRowBtn" type="button" style="display:none;">＋ 新增一列</button>
      <button class="add-row-btn" id="importClosedBtn" type="button" style="display:none;">📥 匯入 Sheet 已平倉紀錄（70 筆，僅需一次）</button>
    </div>

    <div class="sheet-footer" id="sheetFooter"></div>
  </div>

  <script type="module" src="holdings-editor.js"></script>
</body>
</html>
