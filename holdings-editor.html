<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>持股更新</title>
<script>
  document.write('<link rel="stylesheet" href="holdings-editor.css?v=' + Date.now() + '">');
</script>
</head>
<body>
  <div class="site-nav">
    <a href="index.html" class="nav-link">📅 報酬日曆</a>
    <a href="holdings-editor.html" class="nav-link active">📊 持股更新</a>
  </div>

  <div class="sheet-wrap">
    <div class="sheet-header">
      <h1>持股更新</h1>
      <div class="auth-row">
        <span class="auth-status" id="authStatus">連線中…</span>
        <button class="auth-btn" id="authBtn" type="button">登入編輯</button>
      </div>
    </div>

    <div class="table-scroll">
      <table class="sheet-table">
        <thead>
          <tr>
            <th>市場</th>
            <th>股票代號</th>
            <th>股票名稱</th>
            <th>股數</th>
            <th>第一筆建倉</th>
            <th>成本均價</th>
            <th>幣別</th>
            <th>現價</th>
            <th>總投入</th>
            <th>現值</th>
            <th>損益</th>
            <th>報酬率</th>
            <th>平倉</th>
            <th>已實現損益</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="sheetBody"></tbody>
        <tfoot id="sheetFoot"></tfoot>
      </table>
    </div>

    <button class="add-row-btn" id="addRowBtn" type="button" style="display:none;">＋ 新增一列</button>

    <div class="sheet-footer" id="sheetFooter"></div>
  </div>

  <script type="module" src="holdings-editor.js"></script>
</body>
</html>
